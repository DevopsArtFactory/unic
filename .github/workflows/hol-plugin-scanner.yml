name: HOL Plugin Scanner

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test scanner summary
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Scan plugin package
        id: scan
        uses: hashgraph-online/ai-plugin-scanner-action@caba2e96aa8ad2feb6cf6fca52442b52e22e779f # v1.2.635
        with:
          plugin_dir: .
          mode: scan
          min_score: 80
          fail_on_severity: high
          online: false
          pr_comment: "off"
          format: json
          output: ${{ runner.temp }}/hol-plugin-scanner-report.json
      - name: Publish scanner summary
        if: ${{ !cancelled() && steps.scan.outputs.report_path != '' }}
        run: python3 .github/scripts/scanner_summary.py "$RUNNER_TEMP/hol-plugin-scanner-report.json" >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve scanner report
        if: ${{ !cancelled() && steps.scan.outputs.report_path != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: hol-plugin-scanner-report
          path: ${{ runner.temp }}/hol-plugin-scanner-report.json
          if-no-files-found: error
          retention-days: 14
