[package]
name = "unic"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
aws-config = "1.8.14"
aws-credential-types = "1.2.8"
aws-sdk-ec2 = "1.183.0"
aws-sdk-sts = "1.99.0"
aws-types = "1.3.10"
clap = { version = "4.5.60", features = ["derive"] }
crossterm = "0.29.0"
dirs = "6.0.0"
ratatui = "0.30.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
tokio = { version = "1.49.0", features = ["macros", "rt-multi-thread"] }
toml = "1.0.3"

[dev-dependencies]
tempfile = "3.26.0"
