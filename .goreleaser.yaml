version: 2

builds:
  - id: unic
    main: ./cmd/unic
    binary: unic
    ldflags:
      - -s -w
      - -X unic/internal/cli.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
  - id: unic-mcp
    main: ./cmd/unic-mcp
    binary: unic-mcp
    ldflags:
      - -s -w
      - -X unic/internal/cli.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - ids:
      - unic
      - unic-mcp
    format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

brews:
  - repository:
      owner: DevopsArtFactory
      name: homebrew-unic
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    name: unic
    homepage: "https://github.com/DevopsArtFactory/unic"
    description: "Go-based TUI tool for browsing and managing AWS resources in the terminal"
    license: "MIT"
    install: |
      bin.install "unic", "unic-mcp"
    test: |
      system "#{bin}/unic", "--version"
      assert_predicate bin/"unic-mcp", :executable?

release:
  footer: |

    ## Install

    ```bash
    brew tap DevopsArtFactory/unic
    brew trust DevopsArtFactory/unic   # Homebrew 7.0+ only
    brew install unic
    ```

    Homebrew 7.0 refuses to load formulae from untrusted taps, so `brew install` fails
    without the `trust` step. The subcommand does not exist before 7.0 — skip it there.

    ```bash
    curl -sSL https://raw.githubusercontent.com/DevopsArtFactory/unic/main/install.sh | sh
    ```

    Both install the `unic` TUI and the `unic-mcp` stdio server. See the
    [README](https://github.com/DevopsArtFactory/unic#installation) for configuration,
    MCP client setup, and upgrade paths.

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
