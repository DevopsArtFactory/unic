version: 2

builds:
  - main: ./cmd/unic
    binary: unic
    ldflags:
      - -s -w
      - -X unic/internal/cli.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

brews:
  - repository:
      owner: DevopsArtFactory
      name: homebrew-unic
    name: unic
    homepage: "https://github.com/DevopsArtFactory/unic"
    description: "Go-based TUI tool for browsing and managing AWS resources in the terminal"
    license: "MIT"
    install: |
      bin.install "unic"
    test: |
      system "#{bin}/unic", "--version"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
