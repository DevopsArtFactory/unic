version: 2

builds:
  - id: unic
    main: ./cmd/unic
    binary: unic
    ldflags:
      - -s -w
      - -X unic/internal/cli.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64
  - id: unic-mcp
    main: ./cmd/unic-mcp
    binary: unic-mcp
    ldflags:
      - -s -w
      - -X unic/internal/cli.Version={{.Version}}
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - ids:
      - unic
      - unic-mcp
    format: tar.gz
    name_template: "{{ .ProjectName }}-{{ .Os }}-{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

brews:
  - repository:
      owner: DevopsArtFactory
      name: homebrew-unic
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    name: unic
    homepage: "https://github.com/DevopsArtFactory/unic"
    description: "Go-based TUI tool for browsing and managing AWS resources in the terminal"
    license: "MIT"
    install: |
      bin.install "unic", "unic-mcp"
    test: |
      system "#{bin}/unic", "--version"
      assert_predicate bin/"unic-mcp", :executable?

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
